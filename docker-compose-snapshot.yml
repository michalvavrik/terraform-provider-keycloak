volumes:
  postgres:
services:
  postgres:
    environment:
    - POSTGRES_DB=keycloak
    - POSTGRES_USER=keycloak
    - POSTGRES_PASSWORD=password
    image: postgres:16
    volumes:
    - postgres:/var/lib/postgresql
  keycloak:
    image: quay.io/keycloak/keycloak:nightly
    volumes:
      - ./provider/testdata:/opt/keycloak/testdata:z
    command: start-dev --features=client-admin-api,preview
    depends_on:
    - postgres
    environment:
    - KC_BOOTSTRAP_ADMIN_USERNAME=keycloak
    - KC_BOOTSTRAP_ADMIN_PASSWORD=password
    - KC_LOG_LEVEL=INFO,org.keycloak.admin.api:DEBUG
    - KC_HTTP_ACCESS_LOG_ENABLED=true
    - KC_DB=postgres
    - KC_DB_URL_HOST=postgres
    - KC_DB_URL_PORT=5432
    - KC_DB_URL_DATABASE=keycloak
    - KC_DB_USERNAME=keycloak
    - KC_DB_PASSWORD=password
    - KC_LOG_CONSOLE_COLOR=true
    - KC_FEATURES=client-admin-api,preview
    - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/testdata/tls/server-cert.pem
    - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/testdata/tls/server-key.pem
    ports:
    - "8080:8080"
    - "8443:8443"
